[project]
name = "wildfire-eu-study"
version = "2.0.0a0"
description = "European wildfires 2006-2026: data platform, statistical models and Power BI report"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Tristan Mas" }]
requires-python = ">=3.11,<3.13"
dependencies = [
    "requests==2.32.3",
    "pandas==2.2.3",
    "pyarrow==17.0.0",
    "openpyxl==3.1.5",
    "python-dotenv==1.0.1",
    "requests-cache==1.2.1",
    "tqdm==4.67.1",
    "pip-system-certs==5.3; sys_platform == 'win32'",
    "geopandas==1.0.1",
    "shapely==2.0.6",
    "cdsapi==0.7.7",
    "xarray==2024.11.0",
    "netCDF4==1.7.2",
    "pandera==0.22.1",
    "dagster==1.13.26",
    "dagster-webserver==1.13.26",
    "dagster-dbt==0.29.26",
    "dbt-core==1.11.16",
    "dbt-duckdb==1.11.0",
]

[dependency-groups]
dev = [
    "pytest==8.3.4",
    "ruff==0.8.4",
    "mypy==1.14.1",
    "types-requests==2.32.0.20241016",
    "types-tqdm==4.67.0.20241221",
    "lightgbm>=4.7.0",
    "duckdb>=1.5.6",
    "scikit-learn>=1.9.1",
    "matplotlib>=3.11.2",
]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["powerbi", "data"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.mypy]
python_version = "3.11"
files = ["src", "tests"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true

[tool.dagster]
module_name = "src.orchestration.definitions"
code_location_name = "wildfire"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
