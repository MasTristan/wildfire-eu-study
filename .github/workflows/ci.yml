name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.5.x"
          enable-cache: true

      - name: Install (locked)
        run: uv sync --locked

      - name: Lint (ruff)
        run: uv run ruff check src tests scripts

      - name: Type-check (mypy)
        run: uv run mypy

      - name: Test (pytest, no network, no data)
        run: uv run pytest

      - name: requirements.txt mirrors uv.lock
        run: |
          uv export --no-hashes --no-dev --format requirements-txt -o /tmp/req.txt
          diff -u requirements.txt /tmp/req.txt
